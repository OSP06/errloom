id: "cloudflare-bgp-hijack"
level: "advanced"
title: "Cloudflare's BGP Route Leak"
duration: "30 minutes"
teaches:
  - "BGP Routing"
  - "Network Infrastructure"
  - "Global Outages"
  - "Internet Architecture"

context: |
  You're on call at Cloudflare. June 24, 2019, 2:00 PM PST.
  
  Suddenly, alerts everywhere. Traffic routing through strange paths.
  CPU spikes to 100% globally.
  
  Users worldwide: "Internet is broken"
  
  You check BGP routes. Your jaw drops.
  
  A small ISP in Pennsylvania just announced incorrect BGP routes.
  They're claiming THEY are the best path to:
  - Cloudflare
  - Amazon
  - Facebook
  - Linode
  
  Half the internet's traffic routing through their tiny network.
  They can't handle 1% of this. Everything melting down.
  
  This isn't malicious. It's a config error that broke the internet.
  
  Your job: Understand BGP and prevent route leaks.

tabs:
  - name: "BGP Status"
    type: "text"
    content: |
      Global Routing Status:
      
      Incorrect BGP Announcements from:
      AS396531 (Allegheny Technologies/Verizon)
      
      Claiming to be best path to:
      - Cloudflare (1.1.1.1)
      - Amazon AWS
      - Facebook
      - Linode
      - 20,000+ other networks
      
      Impact:
      - Traffic misrouted globally
      - Small ISP overwhelmed
      - Packet loss: 60%+
      - Latency: 5000ms+ (was 50ms)
      
      Duration: 90 minutes
      Affected: Millions of users worldwide

  - name: "Logs"
    type: "logs"
    content:
      - time: "14:00:00"
        level: "INFO"
        message: "Normal operations - all green"
      - time: "14:05:00"
