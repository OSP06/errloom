id: netflix-chaos-monkey
level: advanced
title: "When Chaos Testing Got Too Chaotic"
duration: "28 minutes"
description: "Netflix's Chaos Monkey ran longer than intended in production, killing instances faster than autoscalers could recover. Engineers had to patch autoscaling mid-outage."
teaches:
  - Chaos Engineering
  - Autoscaling Limits
  - Resilience Testing
  - Kill Switch Design
modes:
  - guided
  - challenge

context: |
  # 🐵 Chaos Monkey Runaway

  Chaos Monkey - Netflix's tool for randomly terminating instances to test resilience -
  was supposed to run for 1 hour in production. It ran for 4 hours.

  It killed instances faster than autoscalers could replace them. Services degraded
  as available capacity dropped. Engineers had to manually stop Chaos Monkey and
  patch autoscaling logic while fighting the outage.

