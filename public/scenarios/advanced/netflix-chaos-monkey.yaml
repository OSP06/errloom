tasks:
  - id: identify-problem
    title: "Why Couldn't Autoscaler Keep Up?"
    type: multiple-choice
    question: "Autoscaler launches 8 instances/hour, Chaos Monkey kills 12/hour. What's the outcome?"
    options:
      - "System stabilizes at lower capacity"
      - "Net loss of 4 instances/hour - eventual capacity exhaustion"
      - "Autoscaler will eventually catch up"
      - "More instances are launched than killed"
    correct: 1
    explanation: |
      When kill rate exceeds launch rate, capacity trends downward indefinitely.
      Instance launch takes time (AMI boot, health checks, warmup).
      Chaos Monkey kills instantly.

  - id: fix-chaos-testing
    title: "Design Better Chaos Testing"
    type: multiple-choice
    question: "How should chaos testing be designed to prevent runaway scenarios?"
    options:
      - "Never run chaos testing in production"
      - "Implement kill switches, time limits, capacity floor checks, gradual ramp-up"
      - "Let chaos testing run indefinitely to find real issues"
      - "Only run chaos testing manually with constant monitoring"
    correct: 1
    explanation: |
      Modern chaos engineering includes:
      - Hard time limits (auto-stop after duration)
      - Capacity floor (stop if capacity < 70%)
      - Kill switches (manual emergency stop)
      - Gradual ramp (start slow, increase if stable)
      - Steady-state monitoring (rollback if SLOs violated)
      - Blast radius limits (chaos in one region at a time)

completion:
  summary: |
    Chaos engineering is essential but must have limits. Design for:
    - Automatic stop conditions
    - Capacity floor protection
    - Kill switches
    - Gradual intensity increase

    Even resilience tools need resilience safeguards!
