  company: "Google Cloud Platform"
  date: "June 2, 2019"
  impact: "Multiple GCP regions unreachable, network connectivity lost for thousands of customers"
  duration: "~4 hours (partial recovery after 3 hours)"
  root_cause: "Automated network configuration tool removed critical VPC routes due to configuration error"

context: |
  # 🌐 CRITICAL: Google Cloud Network Blackhole

  **Date:** June 2, 2019, 12:25 PM PDT
  **Severity:** CATASTROPHIC - Multi-Region Network Failure
  **Status:** ACTIVE OUTAGE

  ## The Situation

  You're a Senior SRE for Google Cloud Platform. Your pager is exploding with alerts.
  Customers worldwide are reporting that their VPCs (Virtual Private Clouds) are completely
  unreachable. Instances can't communicate. Load balancers are offline. Everything in
  certain regions has gone dark.

  Looking at your monitoring, you see massive packet loss and complete network isolation
  across multiple availability zones. Services that were working perfectly 5 minutes ago
  are now completely unreachable.

  ## What Happened?

  An automated network maintenance tool was running routine configuration updates to
  optimize VPC routing tables. The tool had a bug in its logic that miscalculated which
  routes were "obsolete" and should be removed.

  Instead of removing a few unused routes, it deleted thousands of active, critical routes
  including:
  - Default gateway routes
  - Inter-zone connectivity routes
  - Internet gateway routes
  - Load balancer backend routes

  The result? Massive portions of GCP's network became unreachable - a "blackhole" where
  packets went in but never came out.

  ## Your Mission

  1. Identify why an automation tool removed critical network routes
  2. Understand how route deletion caused complete network isolation
  3. Trace the blast radius across multiple regions
  4. Implement safeguards to prevent automation from destroying infrastructure
  5. Design recovery procedures for large-scale network failures

  This is one of the most severe cloud infrastructure outages in history.

