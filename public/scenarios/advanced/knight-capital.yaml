context: |
  # 🚨 CRITICAL INCIDENT: Algorithmic Trading Meltdown

  **Date:** August 1, 2012, 9:30 AM EST
  **Location:** Knight Capital Group Trading Floor
  **Severity:** CATASTROPHIC

  ## The Situation

  You're the lead engineer for Knight Capital's Retail Market Making (RMM) system.
  Today is the launch of NYSE's new Retail Liquidity Program (RLP). Your team
  deployed new trading software last night to all 8 production trading servers.

  Or so you thought.

  At 9:30 AM, the market opens. Within seconds, your system starts behaving erratically:
  - Massive unexpected buy/sell orders flooding the market
  - Stock prices wildly fluctuating
  - Your risk limits being breached continuously
  - $440 million being lost at a rate of $10 million per minute

  ## What Went Wrong?

  The deployment script failed silently on Server 8. While servers 1-7 got the new RLP code,
  Server 8 still has the old 'Power Peg' algorithm from 2003 - code that was supposed to be
  dead but was never removed.

  The new code repurposed an old flag ('PNP' = Power Peg) to mean "parent order" for the
  new RLP feature. Server 8 interpreted every incoming parent order as a Power Peg command,
  causing it to execute thousands of unintended child orders.

  ## Your Mission

  1. Identify why Server 8 behaved differently from the other 7 servers
  2. Understand how dead code caused catastrophic failure
  3. Trace the deployment inconsistency
  4. Implement safeguards to prevent partial deployments
  5. Design kill switches for runaway trading algorithms

  This is one of the most expensive software bugs in history.

