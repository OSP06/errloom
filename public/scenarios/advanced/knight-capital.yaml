tasks:
  - id: identify-issue
    title: "Identify the Inconsistency"
    type: multiple-choice
    question: |
      Looking at the logs and server status, what caused Server-8 to behave
      differently from the other 7 servers?
    options:
      - "Server-8 had a hardware failure that corrupted the new code"
      - "The deployment script skipped Server-8 due to SSH timeout, leaving it with old code"
      - "Server-8 was deliberately configured to use the old algorithm for testing"
      - "A hacker modified Server-8 to execute unauthorized trades"
    correct: 1
    explanation: |
      Correct! The deployment log shows the critical failure:

      ```
      [02:12:30] WARNING: SSH timeout for Server-8
      [02:12:41] SKIPPING Server-8 (manual intervention required)
      [02:15:00] Deployment completed: 7/8 servers
      [02:20:16] Production deployment marked as: SUCCESS
      ```

      The deployment script encountered an SSH timeout for Server-8 and simply
      skipped it, yet marked the overall deployment as "SUCCESS."

      This meant:
      - Servers 1-7: Running new RLP code (flag 'PNP' = parent order)
      - Server 8: Running old 2003 code (flag 'PNP' = Power Peg algorithm)

      When the load balancer sent orders with the 'PNP' flag to Server-8,
      it activated the dormant Power Peg algorithm, creating thousands of
      unintended child orders.

  - id: dead-code-risk
    title: "Understanding Dead Code Risk"
    type: multiple-choice
    question: |
      The Power Peg algorithm was deprecated in 2005 but never removed from the codebase.
      Why was this dead code so dangerous?
    options:
      - "Dead code always causes memory leaks that slow down the system"
      - "The new code accidentally reused the old flag name, reactivating the dead code"
      - "Dead code attracts hackers who exploit deprecated features"
      - "Old code automatically gets executed when new deployments fail"
    correct: 1
    explanation: |
      Exactly! This demonstrates a critical lesson in code maintenance:

      **The Dangerous Flag Reuse:**
      - 2003: 'PNP' flag activates Power Peg algorithm
      - 2005: Power Peg deprecated, but code NOT removed
      - 2012: New RLP feature repurposes 'PNP' flag to mean "parent order"
      - Nobody remembered the old Power Peg code was still in the codebase

      **What Happened:**
      When Server-8 (with old code) received orders with the 'PNP' flag,
      it interpreted them as Power Peg commands and started executing
      thousands of child orders - the exact behavior Power Peg was designed to do.

      **The Lesson:**
      - DELETE dead code, don't just disable it
      - Never reuse flag/variable names without checking history
      - Old code is a ticking time bomb in your codebase
      - Document what flags mean and maintain a registry

      This $440M lesson taught the industry that "commented out code"
      and "deprecated features" must be completely removed.

  - id: fix-deployment
    title: "Fix the Deployment Script"
    type: code-fix
    target_tab: deployment-script
    instructions: |
      The deployment script has critical flaws:
      1. No error handling for failed deployments
      2. No verification that deployment actually succeeded
      3. Marks deployment as "SUCCESS" even when servers are skipped

      Add these critical safeguards:
      1. Check SSH exit codes and fail if deployment to ANY server fails
      2. Verify the deployed version matches expected version
      3. Exit with error code if any server is skipped

      Add error handling that would have caught the Server-8 failure.
    validation:
      contains:
        - "if"
        - "exit 1"
        - "version"
      not_contains:
        - "echo \"Deployment completed\""

  - id: prevent-future
    title: "Prevent Future Disasters"
    type: multiple-choice
    question: |
      Your team is implementing safeguards to prevent this from ever happening again.
      Which combination provides the BEST protection?
    options:
      - "Add more logging and send email notifications when deployments complete"
      - "Require two engineers to manually verify each production deployment"
      - "Implement deployment verification, version checks, and automated rollback on inconsistency"
      - "Deploy to only one server at a time and wait 24 hours between each server"
    correct: 2
    explanation: |
      Perfect! The comprehensive solution includes:

      **1. Deployment Verification**
      - After deployment, query each server for its version
      - Compare actual versions against expected version
      - FAIL if any mismatch detected
      - Don't route traffic until verification passes

      **2. Version Health Checks**
      - Load balancer checks version endpoint, not just /health
      - Remove servers from pool if version mismatches
      - Alert on version inconsistencies

      **3. Automated Rollback**
      - If deployment fails on any server, rollback ALL servers
      - Atomic deployments: all-or-nothing
      - Maintain previous version for instant rollback

      **4. Circuit Breakers for Trading**
      - Kill switch for runaway algorithms
      - Automatic shutoff when:
        - Volume exceeds threshold
        - Losses exceed limit
        - Unusual order patterns detected
      - Required manual approval to restart

      **5. Blue-Green Deployments**
      - Deploy to staging cluster first
      - Verify all servers match
      - Switch traffic only when verified
      - Keep old cluster running for instant rollback

      **What Knight Capital Lacked:**
      - No deployment verification
      - No version consistency checks
      - No automated kill switch
      - No gradual rollout (canary deployment)
      - No way to detect server version drift

      **The Aftermath:**
      Knight Capital lost $440M and was acquired by competitor Getco.
      The SEC fined them $12M for "failing to have adequate technology controls."

      This incident changed financial trading regulations, requiring:
      - Automated kill switches
      - Deployment verification procedures
      - Pre-deployment testing in production-like environments

completion:
  summary: |
    # 💰 The $440 Million Bug

    You've just investigated one of the most expensive software bugs in history.
    In 45 minutes, a simple deployment error nearly bankrupted a major financial firm.

    ## Root Cause Analysis

    **The Perfect Storm:**
    1. ❌ Deployment script silently skipped Server-8
    2. ❌ No verification that all servers got the new code
    3. ❌ Dead code from 2003 still in the codebase
    4. ❌ Flag name 'PNP' reused without checking history
    5. ❌ No kill switch for runaway trading
    6. ❌ Load balancer didn't check server versions

    ## The Timeline

    - **02:12 AM**: Deployment fails on Server-8, script continues
    - **02:20 AM**: Deployment marked "SUCCESS" despite 7/8 completion
    - **09:30 AM**: Market opens, RLP orders start flowing
    - **09:30:05**: Server-8 activates old Power Peg algorithm
    - **09:45:12**: Trading halted after $440M in losses

    ## What We Learned

    **1. Partial Deployments Are Deadly**
    In distributed systems, consistency is everything. One server
    running old code can cause catastrophic failures.

    **2. Dead Code Is Technical Debt**
    The Power Peg code was 9 years old and "deprecated." But deprecated
    doesn't mean safe - it means dangerous. Delete dead code immediately.

    **3. Flag Names Are Forever**
    Reusing variable/flag names without checking history is playing
    Russian roulette with your codebase.

    **4. Deployment Is Not "Set and Forget"**
    - Verify every deployment
    - Check version consistency
    - Have rollback procedures
    - Test in production-like environments

    **5. Financial Systems Need Kill Switches**
    Automated circuit breakers can stop disasters before they
    cost hundreds of millions of dollars.

    ## The Real Cost

    - **Direct Loss**: $440 million in bad trades
    - **Company Value**: Stock dropped 75% in two days
    - **Jobs**: Massive layoffs followed
    - **Independence**: Forced acquisition by competitor Getco
    - **Reputation**: Industry credibility destroyed
    - **Regulatory**: $12 million SEC fine

    ## Industry Changes

    This incident led to:
    - ✅ Stricter SEC regulations on algorithmic trading
    - ✅ Required kill switches for trading algorithms
    - ✅ Pre-deployment testing requirements
    - ✅ Mandatory deployment verification procedures
    - ✅ Industry-wide adoption of blue-green deployments
    - ✅ Version consistency checks as standard practice

    ## The Takeaway

    Knight Capital's failure wasn't just technical - it was cultural.
    They had a deployment script that could silently fail, dead code
    that nobody remembered, and no safeguards against inconsistency.

    **Remember**: In production systems, especially financial ones,
    "mostly deployed" is the same as "not deployed." Consistency
    checking isn't optional - it's critical.

