  company: "Fastly CDN"
  date: "June 8, 2021"
  impact: "85% of Fastly's network returned errors, affecting thousands of major websites globally for ~1 hour"
  duration: "~49 minutes"
  root_cause: "Customer configuration change triggered undiscovered software bug in edge servers, causing cascading failures"

context: |
  # 🌐 CRITICAL: Global CDN Meltdown

  **Date:** June 8, 2021, 9:47 AM UTC
  **Location:** Fastly Edge Servers Worldwide
  **Severity:** GLOBAL OUTAGE

  ## The Situation

  You're an SRE at Fastly, one of the world's largest CDNs. At 9:47 AM UTC, your edge servers
  start returning HTTP 503 errors globally. Within minutes, some of the internet's biggest
  sites go down:

  - **Reddit** - completely offline
  - **GitHub** - unavailable
  - **Stack Overflow** - down
  - **CNN, Guardian, NYT** - news sites offline
  - **Twitch** - streaming interrupted
  - **gov.uk** - UK government sites unreachable

  85% of your network is returning errors. Millions of users worldwide are affected.

  ## What Triggered It?

  A single customer enabled a seemingly innocent configuration option. This configuration
  had been used successfully by other customers before. But when combined with a specific
  software update from May 12th, it triggered a latent bug in your edge server code.

  The bug caused individual edge servers to crash. But due to a flaw in your recovery
  mechanism, when they restarted they immediately crashed again - creating a crash loop.

  ## Your Mission

  1. Identify why a customer configuration change caused global failures
  2. Understand how the bug remained hidden despite testing
  3. Trace why 85% of servers failed, not just a few
  4. Analyze why the failure cascaded instead of being isolated
  5. Implement safeguards for configuration-triggered bugs

  This outage made global headlines and demonstrated how fragile internet infrastructure can be.

