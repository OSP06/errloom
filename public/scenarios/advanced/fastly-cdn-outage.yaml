  - name: "VCL Compiler Bug"
    type: code
    content:
      language: c
      content: |
        // vcl_compiler.c - Fastly Edge Server Configuration Compiler
        // Bug introduced in May 12, 2021 update

        int compile_cache_config(struct vcl_config *cfg) {
            // Handle cache mode configuration
            if (cfg->cache_mode == MODE_IGNORE) {
                // Skip cache entirely for this rule
                disable_cache_layer();
            }

            // Handle TTL override
            if (cfg->ttl_override == ENABLED) {
                // Set custom TTL for cached objects
                set_cache_ttl(cfg->ttl_value);
            }

            // BUG: Missing validation for incompatible combination
            // If cache_mode is MODE_IGNORE, TTL override doesn't make sense
            // because nothing is being cached!
            //
            // This combination was theoretically possible in the config API
            // but was never actually used by any customer until June 8, 2021
            //
            // When this combination occurs:
            // 1. disable_cache_layer() is called
            // 2. set_cache_ttl() tries to configure non-existent cache
            // 3. Assertion fails because cache layer was disabled
            // 4. Process crashes

            // MISSING CHECK:
            // if (cfg->cache_mode == MODE_IGNORE && cfg->ttl_override == ENABLED) {
            //     return ERR_INVALID_CONFIG;
            // }

            return SUCCESS;
        }

        // This code passed all existing tests because:
        // 1. Tests only checked MODE_IGNORE in isolation
        // 2. Tests only checked ttl_override in isolation
        // 3. No test checked the COMBINATION
        // 4. Configuration validation API allowed the combination

