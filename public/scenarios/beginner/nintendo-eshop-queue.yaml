id: nintendo-eshop-queue
level: beginner
title: "The Launch Day Collapse"
duration: "16 minutes"
description: "A new game release overloaded the Nintendo eShop queue system, causing stalls across the entire store. Debug the queue saturation."
teaches:
  - Queue Management
  - Capacity Planning
  - Rate Limiting
  - Traffic Spikes
modes:
  - guided
  - challenge

context: |
  # 🎮 Nintendo eShop Queue Meltdown

  **Date:** March 2020
  **Event:** Animal Crossing: New Horizons Launch
  **Status:** eShop completely stalled

  A major game just launched and millions of players are trying to download it simultaneously.
  The eShop queue system is completely overwhelmed. Downloads aren't starting, the store
  is unresponsive, and even browsing other games is impossible.

  ## The Problem

  The download queue was designed for normal traffic (1,000 concurrent downloads).
  But 500,000 players all clicked "Download" within the first 5 minutes.

  The queue filled up, started rejecting new entries, and the queue processor itself
  became so overloaded it stopped processing ANY downloads.

tabs:
