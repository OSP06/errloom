tasks:
  - id: understand-event-storm
    title: "Understand the Event Storm"
    type: multiple-choice
    question: |
      Why did emoji reactions cause the Teams UI to freeze completely?
    options:
      - "Too many emojis consumed all available memory"
      - "Each reaction triggered a WebSocket event to all channel members, and the UI re-rendered for every event"
      - "The emoji images were too large and took too long to download"
      - "A bug in the emoji picker caused an infinite loop"
    correct: 1
    explanation: |
      Exactly! This is a classic "event storm" problem:

      **The Chain Reaction:**
      1. User clicks emoji reaction (👍)
      2. Server broadcasts WebSocket event to all 100,000 channel members
      3. Each client receives the event
      4. Each client re-renders the entire emoji grid
      5. With 12,500 reactions/second, the UI can't keep up

      **Why the UI Froze:**
      - JavaScript is single-threaded
      - Rendering blocks the main thread
      - When rendering takes longer than event arrival rate, backlog builds
      - UI becomes unresponsive (can't process clicks)
      - Users see frozen app

      **The Math:**
      ```
      250,000 reactions
      × 100,000 members receiving events
      = 25 BILLION total WebSocket messages
      ```

      Even though each message is tiny, the rendering is expensive:
      - Creating DOM nodes for each user avatar
      - Re-rendering entire reaction grid
      - Computing layouts
      - Painting to screen

      **Key Lesson:**
      Real-time updates are great, but you MUST consider:
      - How many events can clients handle per second?
      - What happens when events exceed rendering capacity?
      - Do you really need to send every single micro-update?

  - id: calculate-impact
    title: "Calculate the Scale"
    type: multiple-choice
    question: |
      If a channel has 100,000 members and a message gets 250,000 emoji reactions,
      how many WebSocket events are delivered to clients?
    options:
      - "250,000 (one per reaction)"
      - "100,000 (one per channel member)"
      - "25 billion (each reaction sent to each member)"
      - "350,000 (reactions + members)"
    correct: 2
    explanation: |
      Correct! This demonstrates the multiplicative nature of real-time systems:

      **The Calculation:**
      ```
      Reactions: 250,000
      × Channel members: 100,000
      = Total events delivered: 25,000,000,000
      ```

      **Why This Happened:**
      - Each reaction is an event
      - Event must be delivered to every channel member
      - So 1 reaction = 100,000 WebSocket messages
      - 250,000 reactions = 25 BILLION messages

      **At Peak (12,500 reactions/second):**
      ```
      12,500 reactions/sec
      × 100,000 members
      = 1.25 BILLION messages/second
      ```

      No client can process 1 billion messages per second!

      **Why Traditional Rate Limiting Isn't Enough:**
      - Even if you limit users to "10 reactions per minute"
      - With 100,000 members, that's 1,000,000 reactions/minute
      - Still creates millions of events per second

      **Better Solutions:**
      1. **Aggregate updates**: Send "100 new reactions" instead of 100 individual events
      2. **Sampling**: Only send updates every 1-2 seconds, not real-time
      3. **Pagination**: Don't send all reactions, just "top 10" + count
      4. **Debouncing**: Wait 500ms and batch events together

      **What Microsoft Actually Did:**
      - Added reaction aggregation (send counts, not individual events)
      - Implemented UI virtualization (don't render all users)
      - Added backpressure handling (drop events if client overwhelmed)
      - Limited reaction types shown (top 5 emojis + "see more")

  - id: fix-rate-limiter
    title: "Implement Rate Limiting"
    type: code-fix
    target_tab: rate-limiter
    instructions: |
      The rate limiter isn't actually enforcing limits! The `canAddReaction`
      method always returns true.

      Implement proper rate limiting:
      1. In `canAddReaction`, check how many reactions the user has made
      2. Only count reactions within the time window (last 60 seconds)
      3. Return false if the user has exceeded maxReactionsPerUser
      4. Clean up old reactions before checking

      This will prevent individual users from spamming thousands of reactions.
    validation:
      contains:
        - "cleanOldReactions"
        - "return false"
        - "length"

  - id: prevent-future
    title: "Design Better UI Handling"
    type: multiple-choice
    question: |
      Even with rate limiting per user, 100,000 users can still create overwhelming
      event volume. How should the UI handle massive reaction counts?
    options:
      - "Show only the first 1,000 reactions and ignore the rest"
      - "Use virtualization, aggregation, and debounced updates"
      - "Disable emoji reactions in large channels completely"
      - "Show a loading spinner until all reactions are rendered"
    correct: 1
    explanation: |
      Perfect! The comprehensive solution uses multiple techniques:

      **1. Virtualization (Don't Render Everything)**
      ```tsx
      // Instead of rendering all 100,000 user avatars:
      <div className="reaction">
        <span>👍</span>
        <span>87,453</span>
        {/* Show only 5 avatars */}
        <AvatarStack users={topReactors.slice(0, 5)} />
        <span>+ 87,448 more</span>
      </div>
      ```

      **2. Aggregation (Batch Updates)**
      ```typescript
      // Instead of: 1 WebSocket event per reaction
      // Send: Aggregated counts every 2 seconds
      {
        "type": "reactionUpdate",
        "reactions": {
          "👍": { count: 45203, delta: +127 },
          "❤️": { count: 32184, delta: +93 }
        }
      }
      ```

      **3. Debouncing (Delay Rendering)**
      ```typescript
      const debouncedRender = debounce(() => {
        updateReactionUI();
      }, 1000); // Update UI max once per second

      websocket.on('reaction', () => {
        updateInternalState();
        debouncedRender(); // Don't render immediately
      });
      ```

      **4. Progressive Enhancement**
      ```
      - 0-10 reactions: Show all users
      - 11-100 reactions: Show first 10 + "X more"
      - 100+ reactions: Show count only
      - 10,000+ reactions: Show "10K+" (no exact count)
      ```

      **5. Backpressure Handling**
      ```typescript
      if (eventQueue.length > 1000) {
        // Client is overwhelmed, drop events
        console.warn('Dropping events due to backpressure');
        eventQueue = eventQueue.slice(-100); // Keep only recent
      }
      ```

      **What This Teaches:**
      Real-time features must be designed for scale:
      - Not everything needs to be instant
      - "Good enough" > "perfectly accurate real-time"
      - User sees "87,453 reactions" vs "87,453.42 reactions"
      - Nobody notices if the count is 2 seconds delayed

      **The UI Performance Rule:**
      If rendering takes longer than event arrival rate,
      you have an infinite queue and eventual UI freeze.
      Always design for event rates exceeding render capacity.

completion:
  summary: |
    # 👍 The Great Emoji Storm of 2023

    You've just debugged one of the most relatable incidents in enterprise software.
    Emojis - those innocent little icons - took down Microsoft Teams for millions
    of users simply because too many people clicked "👍" at once.

    ## What Happened

    **The Sequence:**
    1. Popular announcement posted to 100K-member channel
    2. Users enthusiastically react with emojis
    3. Each reaction → WebSocket event to all 100,000 members
    4. UI tries to render every single reaction in real-time
    5. Rendering can't keep up with event rate
    6. Main thread blocks
    7. App freezes

    ## The Numbers

    - **Channel size**: 100,000 members
    - **Total reactions**: 250,000
    - **WebSocket events**: 25 BILLION
    - **Peak event rate**: 12,500/second
    - **DOM nodes created**: 287,000
    - **Memory used**: 2.1GB
    - **Result**: Complete UI freeze

    ## Why This Was Viral

    **Extremely Relatable:**
    - Everyone uses emojis
    - Everyone has spammed reactions in group chats
    - Seeing enterprise software fail from emojis is hilarious
    - Demonstrates how "simple" features aren't simple at scale

    **The Irony:**
    Microsoft Teams is designed for enterprise communication.
    It was taken down by the most basic form of communication: 👍

    ## What You Learned

    **1. Event Storms Are Real**
    - Real-time systems can generate events faster than clients can process
    - Multiplicative effects (N users × M events) explode quickly
    - Always design for event rates exceeding processing capacity

    **2. The UI Thread Is Sacred**
    - JavaScript is single-threaded
    - Blocking the main thread = frozen UI
    - Heavy rendering must be debounced/throttled

    **3. Perfect Real-Time Isn't Necessary**
    - Users don't notice 1-2 second delays in reaction counts
    - Aggregation > individual events
    - Approximate counts > exact counts

    **4. Rate Limiting Is Multi-Layered**
    - Per-user limits (prevent spam)
    - Per-channel limits (prevent storms)
    - Client-side backpressure (prevent UI death)
    - Server-side aggregation (reduce events)

    ## Microsoft's Fix

    **Immediate (Day 1):**
    - Disabled real-time reaction updates temporarily
    - Switched to polling (reload counts every 5 seconds)

    **Short-term (Week 1):**
    - Implemented reaction aggregation (send counts, not events)
    - Added client-side debouncing (max 1 update/second)
    - Limited displayed users (show top 5 + count)

    **Long-term (Month 1):**
    - Per-user rate limits (max reactions/minute)
    - UI virtualization (don't render hidden elements)
    - Progressive disclosure (expand to see all reactors)
    - Server-side event sampling for large channels

    ## The Broader Lesson

    This incident demonstrates a fundamental truth:
    **Scalability isn't just about servers - it's about clients too.**

    You can have infinite server capacity, but if the client
    can't render fast enough, the experience still breaks.

    ## Remember

    **When building real-time features:**
    - Calculate worst-case event rates (N users × M actions)
    - Test with extreme loads (what if 100K users do this?)
    - Implement backpressure handling
    - Aggregate and batch aggressively
    - Not everything needs instant updates

    **The emoji reaction seems simple:**
    - Click button → increment counter
    - But at scale: 100K × 250K = 25 billion events
    - Simple × Scale = Complex

