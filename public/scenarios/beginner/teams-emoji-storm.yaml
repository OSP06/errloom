real_incident:
  company: "Microsoft Teams"
  date: "February 2023"
  impact: "Teams UI froze for millions of users due to emoji reaction flood in large channels"
  duration: "~2 hours of degraded service"
  root_cause: "No rate limiting on emoji reactions; WebSocket backpressure caused UI freeze"

context: |
  # 👍 Incident Report: The Great Emoji Storm

  **Date:** February 15, 2023, 10:15 AM PST
  **Severity:** HIGH - Global UI Freeze
  **Status:** ACTIVE INCIDENT

  ## The Situation

  You're an engineer at Microsoft working on Teams. Users are reporting that the Teams
  desktop app is completely frozen. The app loads, but clicking anything does nothing.
  The UI is completely unresponsive.

  Reports are flooding in from enterprise customers worldwide:
  - Fortune 500 companies unable to communicate
  - Remote teams unable to collaborate
  - Support tickets exceeding 50,000 and climbing

  ## What's Happening?

  A popular company announcement was posted in a public channel with 100,000 members.
  Employees started reacting with emojis (👍 ❤️ 😂). The reactions kept coming.
  And coming. And coming.

  Within minutes, the message had over 250,000 emoji reactions. Every new reaction
  triggered a real-time update sent via WebSocket to every single member of the channel.

  The client-side rendering engine couldn't keep up. The UI thread became completely
  blocked trying to render hundreds of thousands of emojis, making the entire app freeze.

  ## Your Mission

  1. Identify why emoji reactions caused UI freezing
  2. Understand the WebSocket event storm
  3. Calculate the message explosion (100K users × reactions = chaos)
  4. Implement rate limiting to prevent future emoji storms
  5. Fix the UI rendering to handle large emoji counts

