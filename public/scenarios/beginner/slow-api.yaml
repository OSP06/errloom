id: "slow-api"
level: "beginner"
title: "The Slow API"
duration: "20 minutes"
teaches:
  - "Performance"
  - "Database Queries"
  - "N+1 Problem"

context: |
  Your homepage is live and working! But users are complaining it's slow.

  The page shows a list of 100 blog posts, and each post displays:
  - Title
  - Author name
  - Number of comments

  Loading the page takes 8 seconds. Your boss is not happy.

  Your job: Find out why it's slow and fix it.

