context: |
  # 🚩 CRITICAL: Feature Flag Disaster

  **Date:** March 18, 2021, 11:23 AM PST
  **Severity:** CRITICAL - Global Outage
  **Status:** ONGOING

  ## The Situation

  You're an SRE at LinkedIn. Users are reporting that key pages are completely broken:
  - Profile pages showing errors
  - Feed not loading
  - Messaging unavailable
  - Jobs page failing

  The errors started exactly at 11:20 AM - 3 minutes ago. Before that, everything was fine.

  Looking at your deployment dashboard, you see that a feature flag rollout completed at 11:20 AM.
  The flag was called `enable_new_profile_cache` and it was rolled out to 100% of users.

  ## What Went Wrong?

  A developer created a feature flag to enable a new caching layer for profile data.
  The flag was thoroughly tested with the default value `false` (disabled).

  But when creating the production flag configuration, someone made a typo:
  ```json
  {
    "enable_new_profile_cache": true,  // Should be: false
    "rollout_percentage": 100
  }
  ```

  The flag rolled out to 100% of users with the value `true`, immediately enabling
  the new cache layer for everyone. The problem? The cache layer wasn't actually deployed yet.
  It only existed in staging.

  ## Your Mission

  1. Identify why feature flag changes caused instant global failures
  2. Understand the importance of default values
  3. Learn why 100% rollouts are dangerous
  4. Implement gradual rollout strategies
  5. Add safety checks for feature flag deployments

