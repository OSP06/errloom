  - name: "Deployment Timeline"
    type: text
    content: |
      📅 FEATURE FLAG DEPLOYMENT TIMELINE
      ====================================

      **11:15 AM** - Flag Created
      - Developer creates 'enable_new_profile_cache' flag
      - Intends to enable new caching layer
      - Plans gradual rollout: 1% → 10% → 50% → 100%

      **11:17 AM** - Configuration Error
      - Config file edited in production
      - Typo: default_value set to true (should be false)
      - Rollout set to 100% (should be 1%)
      - No validation warnings

      **11:20 AM** - Deployment Executes
      - Feature flag service pushes update
      - All application servers receive update
      - Flag value changes: false → true
      - Applied to 100% of users instantly

      **11:20:02** - Failures Begin
      - Apps try to connect to profile-cache service
      - Service doesn't exist (only deployed in staging)
      - Connection refused errors
      - Fallback logic missing

      **11:20:05** - Cascade Begins
      - Profile pages fail (no cache connection)
      - Feed fails (depends on profiles)
      - Messaging fails (depends on profiles)
      - Jobs fail (depends on profiles)

      **11:23 AM** - Incident Detected
      - PagerDuty alerts flooding in
      - Error rate: 94%
      - Millions of users affected

      **11:25 AM** - Rollback Initiated
      - Feature flag value changed: true → false
      - Propagation time: ~2 minutes

      **11:27 AM** - Recovery Begins
      - Error rate dropping
      - Services recovering

      **11:32 AM** - Full Recovery
      - Error rate back to normal
      - Total outage: 12 minutes

