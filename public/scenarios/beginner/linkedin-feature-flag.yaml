tasks:
  - id: identify-mistake
    title: "Identify the Configuration Mistake"
    type: multiple-choice
    question: |
      Looking at the feature flag configuration, what caused LinkedIn pages
      to fail globally at exactly 11:20 AM?
    options:
      - "A hacker gained access and modified the feature flag maliciously"
      - "The feature flag had default_value: true and rollout: 100%, enabling a non-existent service for all users"
      - "The LinkedIn servers crashed due to high traffic"
      - "A database migration deleted critical user data"
    correct: 1
    explanation: |
      Exactly! This was a configuration error with catastrophic impact:

      **The Mistake:**
      ```json
      {
        "default_value": true,     // ← Typo! Should be false
        "rollout_percentage": 100  // ← Should start at 1%
      }
      ```

      **What This Caused:**
      1. At 11:20 AM, flag deployed to all servers
      2. All users instantly got `enable_new_profile_cache = true`
      3. Code tried to connect to `profile-cache.linkedin.internal`
      4. Service didn't exist in production (only in staging)
      5. Connection failed → HTTP 500 errors
      6. 94% of requests failed globally

      **Why So Fast?**
      Feature flags update in real-time via:
      - WebSocket connections to flag service
      - Instant propagation to all app servers
      - No gradual rollout, no canary testing
      - 100% of users affected simultaneously

      **The Cascading Failures:**
      - Profile pages failed → Feed failed → Messaging failed
      - All services depended on profile data
      - No fallback logic to use database

      **Key Lesson:**
      A single character typo (`true` vs `false`) took down
      LinkedIn globally. Feature flags are powerful but dangerous.
      They need the same rigor as code deployments.

  - id: understand-blast-radius
    title: "Why Was the Blast Radius So Large?"
    type: multiple-choice
    question: |
      Why did this affect 100% of users instead of being limited to a
      small percentage or specific user group?
    options:
      - "LinkedIn doesn't support gradual rollouts for feature flags"
      - "The configuration specified 100% rollout with no targeting rules"
      - "All users happened to access LinkedIn at the same moment"
      - "The error was in shared infrastructure that all users depend on"
    correct: 1
    explanation: |
      Correct! The configuration had no blast radius controls:

      **What Was Deployed:**
      ```json
      {
        "rollout_percentage": 100,
        "targeting_rules": []
      }
      ```

      **What Should Have Been Deployed:**
      ```json
      {
        "rollout_percentage": 1,  // Start small!
        "targeting_rules": [
          {
            "condition": "user_type == 'employee'",
            "value": true
          },
          {
            "condition": "user_type == 'beta_tester'",
            "value": true
          }
        ]
      }
      ```

      **Gradual Rollout Strategy:**
      ```
      Phase 1: Employees only (1,000 users)
      ↓ Monitor for 24 hours
      Phase 2: 1% of users (~8,000 users)
      ↓ Monitor for 12 hours
      Phase 3: 10% of users (~80,000 users)
      ↓ Monitor for 6 hours
      Phase 4: 50% of users
      ↓ Monitor for 3 hours
      Phase 5: 100% of users
      ```

      **Why Gradual Rollout Matters:**
      - Catches bugs affecting small group first
      - Limits blast radius of failures
      - Allows time to detect and rollback
      - Gives monitoring time to catch issues

      **The Math:**
      - 1% rollout = 80,000 users affected if bug
      - 100% rollout = 8,000,000 users affected if bug
      - 100× larger impact from instant rollout

      **Best Practices:**
      1. Always start with employees/beta testers
      2. Never jump straight to 100%
      3. Monitor each phase before proceeding
      4. Have automatic rollback on error spikes
      5. Use targeting rules for controlled testing

  - id: fix-validator
    title: "Add Flag Validation"
    type: code-fix
    target_tab: flag-validator
    instructions: |
      Add validation rules to prevent dangerous feature flag configurations.

      The validator should check for:
      1. If rollout_percentage is 100%, reject it (should start smaller)
      2. If the flag requires a service, check if that service exists
      3. If default_value is true for a new flag, warn about it

      Add at least 2 validation errors to the errors array.
    validation:
      contains:
        - "rollout_percentage"
        - "errors.push"
        - "100"

  - id: design-safety
    title: "Design Better Safety Mechanisms"
    type: multiple-choice
    question: |
      How should LinkedIn prevent feature flag mistakes from causing
      global outages in the future?
    options:
      - "Require CEO approval for all feature flag changes"
      - "Disable feature flags entirely and only use code deployments"
      - "Implement validation, gradual rollout, automatic rollback, and fallback logic"
      - "Only allow feature flag changes during off-peak hours"
    correct: 2
    explanation: |
      Perfect! A comprehensive solution requires multiple safety layers:

      **1. Configuration Validation (Prevent)**
      ```typescript
      // Reject dangerous configs
      if (flag.rollout_percentage === 100 && !flag.approvedFor100Percent) {
        throw new Error("Cannot deploy to 100% without approval");
      }

      if (flag.requires_service && !serviceExists(flag.requires_service)) {
        throw new Error(`Required service ${flag.requires_service} not deployed`);
      }
      ```

      **2. Forced Gradual Rollout (Limit Blast Radius)**
      ```typescript
      // Automatically enforce gradual rollout
      const rolloutPhases = [
        { percentage: 1, duration: "24h" },
        { percentage: 10, duration: "12h" },
        { percentage: 50, duration: "6h" },
        { percentage: 100, duration: "∞" }
      ];
      ```

      **3. Automatic Rollback (Detect & Recover)**
      ```typescript
      // Monitor error rates after flag change
      if (errorRate > baseline * 1.5) {
        logger.error("Error spike detected, rolling back flag");
        featureFlag.rollback();
      }
      ```

      **4. Fallback Logic (Graceful Degradation)**
      ```java
      try {
        return profileCacheClient.get(userId);
      } catch (ServiceUnavailableException e) {
        // Fallback to database
        return database.queryProfile(userId);
      }
      ```

      **5. Service Dependency Checks**
      ```typescript
      // Pre-deployment validation
      if (flag.requires_service) {
        const serviceHealthy = await checkService(flag.requires_service);
        if (!serviceHealthy) {
          throw new Error("Required service not ready");
        }
      }
      ```

      **6. Staged Environment Testing**
      ```
      1. Dev: Test flag works
      2. Staging: Test with production-like data
      3. Canary: Test with 1% real users
      4. Production: Gradual rollout
      ```

      **What LinkedIn Actually Did:**
      After this incident, they implemented:
      - ✅ Mandatory gradual rollout (can't jump to 100%)
      - ✅ Service dependency validation
      - ✅ Automatic error-rate-based rollback
      - ✅ Required fallback logic for new features
      - ✅ Staging environment must match production
      - ✅ Peer review for feature flag configs

completion:
  summary: |
    # 🚩 The Feature Flag That Broke LinkedIn

    You just debugged a classic configuration management disaster.
    A single typo in a feature flag configuration took down major
    LinkedIn pages for millions of users in seconds.

    ## What Happened

    **The Timeline:**
    - 11:15 AM: Developer creates feature flag
    - 11:17 AM: Config file edited, typo introduced
    - 11:20 AM: Flag deployed to production
    - 11:20:02: Failures begin globally
    - 11:23 AM: Incident detected
    - 11:25 AM: Rollback initiated
    - 11:32 AM: Full recovery

    **The Mistake:**
    ```json
    "default_value": true   // Should be: false
    "rollout_percentage": 100  // Should be: 1
    ```

    ## Why This Was Viral

    **Extremely Common Pattern:**
    - Every company uses feature flags
    - Everyone has made typos in configs
    - The "instant global rollout" is relatable
    - Shows how fragile config management is

    **The Simplicity:**
    Not a complex algorithm bug or infrastructure failure.
    Just a typo. One word. Global outage.

    ## What You Learned

    **1. Feature Flags Are Code**
    - Need same rigor as software deployments
    - Testing, review, gradual rollout
    - Validation and safety checks

    **2. Default Values Matter**
    - `default_value: true` for new features is dangerous
    - Always start with `false` and explicitly enable
    - Typos have massive consequences

    **3. 100% Rollouts Are Dangerous**
    - Never go straight to 100%
    - Always start with 1% or employees
    - Monitor each phase before proceeding

    **4. Fallback Logic Is Critical**
    ```java
    // BAD:
    if (useCache) {
        return cache.get(); // Fails if cache down
    }

    // GOOD:
    if (useCache) {
        try {
            return cache.get();
        } catch (Exception e) {
            return database.get(); // Fallback
        }
    }
    ```

    **5. Service Dependencies Must Be Validated**
    Before enabling a flag that requires a service,
    verify the service actually exists in that environment.

    ## Industry Best Practices

    **Modern Feature Flag Systems:**
    - LaunchDarkly, Split.io, Unleash
    - Built-in gradual rollout
    - Automatic kill switches
    - A/B testing integration
    - Real-time monitoring

    **Rollout Strategy:**
    ```
    Employees (internal testing)
    ↓
    1% users (canary)
    ↓
    10% users (early adopters)
    ↓
    50% users (majority)
    ↓
    100% users (full rollout)
    ```

    **Safety Checks:**
    - Validate configs before deployment
    - Check service dependencies exist
    - Monitor error rates after changes
    - Automatic rollback on spikes
    - Require fallback logic

    ## Remember

    **Configuration is just as dangerous as code:**
    - Typos happen
    - Validation is not optional
    - Gradual rollout is not optional
    - Fallback logic is not optional

    **The feature flag paradox:**
    - Designed to make deployments safer
    - But if misconfigured, can cause instant global outages
    - Safer than code deploys... IF used correctly

    **One character changed LinkedIn's day:**
    - `true` vs `false`
    - 12 minutes of downtime
    - Millions of users affected
    - All from a simple typo

