id: "cache-stampede"
level: "intermediate"
title: "The Cache Stampede"
duration: "28 minutes"
teaches:
  - "Caching Strategies"
  - "Cache Invalidation"
  - "Race Conditions"

context: |
  Your homepage is heavily cached with Redis. Page load time: 50ms.
  Life is good!

  Every night at midnight, you clear the cache to ensure fresh data.

  Tonight at 12:00:01am, your database crashed. CPU went to 100%.
  Thousands of queries hit the database simultaneously.

  The database couldn't handle it and went down, taking your site with it.

  What just happened? Why did clearing the cache kill your database?

  Your job: Figure out why cache invalidation caused a stampede.

