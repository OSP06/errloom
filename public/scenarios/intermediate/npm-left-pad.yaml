context: |
  # 📦 Incident Report: npm Registry Crisis

  **Date:** March 22, 2016, 2:30 PM UTC
  **Severity:** CRITICAL - Global Impact
  **Status:** ONGOING OUTAGE

  ## Situation

  Your team is frantically debugging why your production build pipeline suddenly stopped working.
  Reports are flooding in from developers worldwide - React won't build, Babel is broken,
  and thousands of projects are failing with the same mysterious error:

  ```
  npm ERR! 404 'left-pad' is not in the npm registry
  ```

  ## What Just Happened?

  A developer named Azer Koçulu got into a naming dispute with npm, Inc. and a company called Kik
  over a package name. In protest, he unpublished ALL of his packages from npm, including a tiny
  11-line utility called "left-pad" that pads strings with characters.

  The problem? Over 16,000 packages depended on it, including babel-core, which is used by
  React and countless other major projects.

  ## Your Mission

  You need to:
  1. Understand the cascade failure in the dependency tree
  2. Identify why this single package caused such widespread damage
  3. Implement immediate fixes to get builds working again
  4. Recommend long-term solutions to prevent this from ever happening again

  This is a real incident that changed how the entire JavaScript ecosystem thinks about
  dependency management forever.

