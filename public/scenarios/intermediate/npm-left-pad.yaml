  - name: "left-pad.js (Original)"
    type: code
    content:
      language: javascript
      content: |
        // The infamous 11 lines that broke the internet
        module.exports = leftpad;

        function leftpad (str, len, ch) {
          str = String(str);
          var i = -1;
          if (!ch && ch !== 0) ch = ' ';
          len = len - str.length;
          while (++i < len) {
            str = ch + str;
          }
          return str;
        }

        // Usage examples:
        // leftpad('foo', 5)       => '  foo'
        // leftpad('foobar', 6)    => 'foobar'
        // leftpad(1, 2, '0')      => '01'
        // leftpad(17, 5, '0')     => '00017'

